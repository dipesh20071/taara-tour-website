<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tour Package | Taara Tour & Travels</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Inter', sans-serif; background-color: #f8f9fa; }
        .bg-taara-yellow { background-color: #FFC500; }
        .text-taara-yellow { color: #FFC500; }
        .bg-taara-black { background-color: #1A1A1A; }
        .text-taara-black { color: #1A1A1A; }
        #loader { display: flex; }
        #content { display: none; }
    </style>
</head>
<body class="pb-24 lg:pb-0 relative">

    <!-- Loading Overlay -->
    <div id="loader" class="fixed inset-0 bg-white z-[999] flex flex-col items-center justify-center px-4 text-center">
        <div id="spinner" class="animate-spin rounded-full h-12 w-12 border-4 border-gray-200 border-t-taara-yellow mb-4"></div>
        <p id="loader-text" class="text-gray-500 font-medium">Fetching Best Package Details...</p>
        <!-- Error Box (Hidden by default) -->
        <div id="debug-box" class="hidden mt-4 p-4 bg-red-50 border border-red-200 rounded-lg text-sm text-red-700 max-w-md"></div>
    </div>

    <!-- MAIN CONTENT (Hidden until data loads) -->
    <div id="content">
        <!-- Mobile Top Header -->
        <header class="bg-white shadow-sm sticky top-0 z-50 px-4 py-3 flex justify-between items-center lg:hidden">
            <div class="flex items-center gap-3">
                <a href="index.html" class="text-gray-700"><svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 19l-7-7 7-7"></path></svg></a>
                <div class="h-8 w-24 bg-gray-200 rounded flex items-center justify-center text-xs font-bold text-gray-500">LOGO</div>
            </div>
            <button class="bg-taara-yellow text-taara-black font-semibold px-4 py-1.5 rounded-md text-sm shadow">Enquire</button>
        </header>

        <main class="max-w-7xl mx-auto lg:px-4 lg:py-6 flex flex-col lg:flex-row gap-6">
            <div class="w-full lg:w-2/3">
                <!-- Dynamic Image -->
                <div class="relative w-full h-[60vh] lg:h-[70vh] lg:rounded-xl overflow-hidden bg-gray-200">
                    <img id="pkg-image" src="" class="w-full h-full object-cover object-center">
                    <div class="absolute inset-0 bg-gradient-to-b from-black/40 via-transparent to-black/60"></div>
                    <div class="absolute top-4 left-4 flex flex-col gap-2">
                        <span id="pkg-type" class="bg-taara-yellow text-taara-black text-xs font-bold px-3 py-1 rounded-md shadow-md inline-block w-max">Premium Tour</span>
                    </div>
                    <div class="absolute top-4 right-4 flex gap-2">
                        <button onclick="openPdfModal()" class="w-10 h-10 bg-taara-yellow rounded-full flex items-center justify-center shadow-lg transform transition hover:scale-105" title="Download PDF">
                            <svg class="w-5 h-5 text-taara-black" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 16v1a3 3 0 003 3h10a3 3 0 003-3v-1m-4-4l-4 4m0 0l-4-4m4 4V4"></path></svg>
                        </button>
                        <a id="pkg-whatsapp" href="#" target="_blank" class="w-10 h-10 bg-taara-yellow rounded-full flex items-center justify-center shadow-lg transform transition hover:scale-105">
                            <svg class="w-6 h-6 text-taara-black" fill="currentColor" viewBox="0 0 24 24"><path d="M17.472 14.382c-.297-.149-1.758-.867-2.03-.967-.273-.099-.471-.148-.67.15-.197.297-.767.966-.94 1.164-.173.199-.347.223-.644.075-.297-.15-1.255-.463-2.39-1.475-.883-.788-1.48-1.761-1.653-2.059-.173-.297-.018-.458.13-.606.134-.133.298-.347.446-.52.149-.174.198-.298.298-.497.099-.198.05-.371-.025-.52-.075-.149-.669-1.612-.916-2.207-.242-.579-.487-.5-.669-.51a12.8 12.8 0 00-.57-.01c-.198 0-.52.074-.792.372-.272.297-1.04 1.016-1.04 2.479 0 1.462 1.065 2.875 1.213 3.074.149.198 2.096 3.2 5.077 4.487.709.306 1.262.489 1.694.625.712.227 1.36.195 1.871.118.571-.085 1.758-.719 2.006-1.413.248-.694.248-1.289.173-1.413-.074-.124-.272-.198-.57-.347m-5.421 7.403h-.004a9.87 9.87 0 01-5.031-1.378l-.361-.214-3.741.982.998-3.648-.235-.374a9.86 9.86 0 01-1.51-5.26c.001-5.45 4.436-9.884 9.888-9.884 2.64 0 5.122 1.03 6.988 2.898a9.825 9.825 0 012.893 6.994c-.003 5.45-4.437 9.884-9.885 9.884m8.413-18.297A11.815 11.815 0 0012.05 0C5.495 0 .16 5.335.157 11.892c0 2.096.547 4.142 1.588 5.945L.057 24l6.305-1.654a11.882 11.882 0 005.683 1.448h.005c6.554 0 11.89-5.335 11.893-11.893a11.821 11.821 0 00-3.48-8.413z"/></svg>
                        </a>
                    </div>
                </div>

                <div class="relative z-10 -mt-12 mx-4 lg:mx-0 bg-white rounded-xl shadow-lg p-5 border-t-4 border-taara-yellow">
                    <h1 id="pkg-title" class="text-2xl font-bold text-gray-900 leading-tight">Loading Title...</h1>
                    <div class="flex items-center gap-4 mt-3 text-sm">
                        <div class="flex items-center text-orange-500 font-semibold">
                            <svg class="w-4 h-4 mr-1" fill="currentColor" viewBox="0 0 20 20"><path d="M9.049 2.927c.3-.921 1.603-.921 1.902 0l1.07 3.292a1 1 0 00.95.69h3.462c.969 0 1.371 1.24.588 1.81l-2.8 2.034a1 1 0 00-.364 1.118l1.07 3.292c.3.921-.755 1.688-1.54 1.118l-2.8-2.034a1 1 0 00-1.175 0l-2.8 2.034c-.784.57-1.838-.197-1.539-1.118l1.07-3.292a1 1 0 00-.364-1.118L2.98 8.72c-.783-.57-.38-1.81.588-1.81h3.461a1 1 0 00.951-.69l1.07-3.292z"></path></svg>4.9
                        </div>
                        <div class="flex items-center text-gray-700 font-medium bg-gray-100 px-2 py-1 rounded">
                            <span id="pkg-duration">--</span>
                        </div>
                    </div>
                    <p id="pkg-location" class="text-gray-500 text-sm mt-3 border-t border-gray-100 pt-3">Loading Location...</p>
                </div>

                <div class="lg:hidden mx-4 mt-4 bg-white rounded-xl shadow border border-gray-100 p-5">
                    <span class="text-sm text-taara-black font-semibold bg-taara-yellow/20 px-2 py-0.5 rounded border border-taara-yellow/50">Starting From</span>
                    <span id="pkg-price-mobile" class="text-2xl font-bold text-gray-900 ml-2">₹--</span>
                </div>
            </div>

            <div class="hidden lg:block w-1/3">
                <div class="sticky top-20 bg-white rounded-xl shadow-lg border border-gray-200 p-6 border-t-4 border-taara-yellow">
                    <span class="text-sm text-taara-black font-semibold bg-taara-yellow/20 px-2 py-0.5 rounded border border-taara-yellow/50">Starting From</span>
                    <div id="pkg-price-desktop" class="text-3xl font-bold text-gray-900 mt-2 mb-4">₹--</div>
                    <button class="w-full bg-taara-yellow hover:bg-yellow-500 text-taara-black font-bold text-lg py-3 rounded-md shadow transition mb-3">Book Now</button>
                    <button onclick="openPdfModal()" class="w-full bg-taara-black hover:bg-gray-800 text-white font-semibold py-3 rounded-md shadow transition flex items-center justify-center gap-2">
                        Download Itinerary PDF
                    </button>
                </div>
            </div>
        </main>

        <div class="lg:hidden fixed bottom-0 left-0 w-full bg-white shadow-[0_-4px_6px_-1px_rgba(0,0,0,0.1)] rounded-t-2xl px-4 py-3 z-50 border-t-2 border-taara-yellow flex justify-between items-center">
            <div>
                <p class="text-xs text-gray-500">Starting From</p>
                <p id="pkg-price-sticky" class="text-xl font-bold text-taara-black">₹--</p>
            </div>
            <button class="bg-taara-yellow text-taara-black font-bold px-8 py-2.5 rounded-lg shadow-md">Book Now</button>
        </div>
    </div>

    <!-- PDF Lead Modal Code Remains Same (Shortened for preview) -->
    <div id="pdfModal" class="fixed inset-0 bg-black/70 z-[100] hidden items-center justify-center p-4 backdrop-blur-sm">
        <div class="bg-white rounded-xl shadow-2xl w-full max-w-md overflow-hidden relative">
            <button onclick="closePdfModal()" class="absolute top-3 right-3 text-gray-400 hover:text-gray-800 z-10"><svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"></path></svg></button>
            <div class="bg-taara-black p-5 text-center border-b-4 border-taara-yellow">
                <h3 class="text-xl font-bold text-white">Download Itinerary</h3>
            </div>
            <div id="pdfErrorMsg" class="hidden bg-red-50 border-l-4 border-red-500 p-6 m-2 rounded-r">
                <p class="text-base text-gray-800 font-semibold mb-2">PDF is currently unavailable.</p>
                <a href="tel:7016036767" class="inline-block mt-2 bg-taara-yellow text-taara-black font-bold px-6 py-2 rounded-full shadow hover:bg-yellow-500">Call 7016036767</a>
            </div>
            <form id="leadForm" class="p-6 space-y-4" onsubmit="submitLeadForm(event)">
                <input type="text" required placeholder="Full Name *" class="w-full border border-gray-300 rounded-md px-4 py-2 focus:ring-taara-yellow">
                <input type="tel" pattern="[0-9]{10}" required placeholder="WhatsApp Number *" class="w-full border border-gray-300 rounded-md px-4 py-2 focus:ring-taara-yellow">
                <input type="email" placeholder="Email Address" class="w-full border border-gray-300 rounded-md px-4 py-2 focus:ring-taara-yellow">
                <button type="submit" class="w-full bg-taara-yellow text-taara-black font-bold py-3 rounded-md shadow mt-2">Get PDF Now</button>
            </form>
            <div id="toastMsg" class="hidden absolute bottom-4 left-1/2 transform -translate-x-1/2 bg-gray-900 text-white px-4 py-2 rounded-full text-sm">Checking...</div>
        </div>
    </div>

    <!-- MAIN JAVASCRIPT: THE MASTER ENGINE -->
    <script>
        const scriptURL = 'https://script.google.com/macros/s/AKfycbzZCMqW12dr_RrDr-0ZTS3gIXd3iQ8PIkznkc1g-Mgek7Rd9nzqRlh5pbEeB4KsS3U93Q/exec'; 

        let currentPackageTitle = "";
        const urlParams = new URLSearchParams(window.location.search);
        const packageId = urlParams.get('id');

        // ERROR HANDLING ENGINE
        function showFatalError(message) {
            document.getElementById('spinner').style.display = 'none';
            document.getElementById('loader-text').innerText = "Oops! Could not load the package.";
            const debugBox = document.getElementById('debug-box');
            debugBox.classList.remove('hidden');
            debugBox.innerHTML = `<strong>Error Details:</strong> <br/> ${message} <br/><br/> <em>Action for Admin: Check if Google Sheet tab is named 'Packages' exactly, and API URL is correct.</em>`;
        }

        if(packageId) {
            // Safety Timeout (If Google Script gets stuck for more than 10 seconds)
            const timeoutFetch = setTimeout(() => {
                showFatalError("Google Apps Script is not responding. Link might be incorrect or deployment permission is not set to 'Anyone'.");
            }, 10000);

            fetch(scriptURL)
                .then(res => {
                    if (!res.ok) throw new Error("Network response was not ok. Status: " + res.status);
                    return res.text(); // First fetch as text to catch HTML errors
                })
                .then(text => {
                    clearTimeout(timeoutFetch);
                    try {
                        const data = JSON.parse(text); // Try parsing JSON
                        
                        if(data.error) {
                            showFatalError("Google Sheet Error: " + data.error);
                            return;
                        }

                        const pkg = data.find(p => p['Package ID'] === packageId);
                        if(pkg) {
                            currentPackageTitle = pkg['Title'];
                            document.getElementById('pkg-title').innerText = currentPackageTitle;
                            
                            const priceFmt = '₹' + Number(pkg['Price']).toLocaleString('en-IN');
                            document.getElementById('pkg-price-desktop').innerText = priceFmt;
                            document.getElementById('pkg-price-mobile').innerText = priceFmt;
                            document.getElementById('pkg-price-sticky').innerText = priceFmt;
                            
                            document.getElementById('pkg-location').innerText = pkg['Location'];
                            document.getElementById('pkg-duration').innerText = pkg['Duration'];
                            document.getElementById('pkg-image').src = pkg['Image URL'] || 'https://via.placeholder.com/800x400?text=No+Image';
                            
                            const waMsg = `Hi, I am interested in the ${currentPackageTitle} package.`;
                            document.getElementById('pkg-whatsapp').href = `https://wa.me/917016036767?text=${encodeURIComponent(waMsg)}`;

                            document.getElementById('loader').style.display = 'none';
                            document.getElementById('content').style.display = 'block';
                        } else {
                            showFatalError(`Package ID '<strong>${packageId}</strong>' not found in the Google Sheet. Please check the 'Package ID' column.`);
                        }
                    } catch (err) {
                        showFatalError("Invalid Response from Google Script. The script URL might be pointing to a Google Login page. Make sure Web App access is set to 'Anyone'.");
                    }
                })
                .catch(err => {
                    clearTimeout(timeoutFetch);
                    showFatalError("Fetch failed. Error: " + err.message);
                });
        } else {
            showFatalError("No Package ID found in the URL. (Example: ?id=kerala-trip)");
        }

        // PDF Logic
        const modal = document.getElementById('pdfModal');
        const errorBox = document.getElementById('pdfErrorMsg');
        const leadForm = document.getElementById('leadForm');
        
        function openPdfModal() { modal.classList.remove('hidden'); modal.classList.add('flex'); errorBox.classList.add('hidden'); leadForm.classList.remove('hidden'); }
        function closePdfModal() { modal.classList.add('hidden'); modal.classList.remove('flex'); }

        function submitLeadForm(e) {
            e.preventDefault();
            const submitBtn = e.target.querySelector('button[type="submit"]');
            submitBtn.innerHTML = 'Wait...';

            fetch(scriptURL, {
                method: 'POST',
                body: JSON.stringify({ name: e.target[0].value, phone: e.target[1].value, email: e.target[2].value, packageReq: currentPackageTitle }),
                headers: { 'Content-Type': 'text/plain;charset=utf-8' }
            })
            .then(res => res.json())
            .then(data => {
                submitBtn.innerHTML = 'Get PDF Now';
                if(data.result === 'success' && data.pdfUrl && data.pdfUrl.trim() !== "") {
                    closePdfModal();
                    window.open(data.pdfUrl, '_blank');
                    e.target.reset();
                } else {
                    leadForm.classList.add('hidden');
                    errorBox.classList.remove('hidden');
                    e.target.reset();
                }
            })
            .catch(() => { submitBtn.innerHTML = 'Get PDF Now'; leadForm.classList.add('hidden'); errorBox.classList.remove('hidden'); });
        }
    </script>
</body>
</html>
