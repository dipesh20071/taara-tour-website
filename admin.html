<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Taara Tours - AI Powered Admin Panel</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Inter', sans-serif; background-color: #f3f4f6; }
        .bg-brand-yellow { background-color: #FFC500; }
        .text-brand-yellow { color: #FFC500; }
        .bg-brand-black { background-color: #1A1A1A; }
        .tab-active { background-color: rgba(255, 255, 255, 0.1); color: #FFC500; border-left: 4px solid #FFC500; }
        .mob-tab-active { background-color: #FFC500 !important; color: #1A1A1A !important; }
    </style>
</head>
<body class="text-gray-800 h-screen flex items-center justify-center" id="body-container">

    <div id="login-screen" class="w-full max-w-md bg-white p-8 md:rounded-2xl shadow-xl border border-gray-100 h-full md:h-auto flex flex-col justify-center">
        <div class="text-center mb-8">
            <div class="bg-brand-black inline-block px-4 py-2 rounded-lg border-b-4 border-brand-yellow mb-4">
                <span class="text-brand-yellow font-extrabold text-2xl">Taara</span> <span class="text-white text-lg font-semibold">Admin</span>
            </div>
            <p class="text-gray-500 text-sm">Secure Staff Portal</p>
        </div>
        <form id="loginForm" onsubmit="handleLogin(event)" class="space-y-5">
            <div id="login-error" class="hidden text-sm text-red-600 bg-red-50 p-3 rounded-lg font-bold text-center"></div>
            <div>
                <label class="block text-xs font-bold text-gray-700 mb-1 uppercase">Email Address</label>
                <input type="email" required id="adminEmail" class="w-full px-4 py-3 border rounded-lg focus:border-brand-yellow bg-gray-50" placeholder="taaratour@gmail.com">
            </div>
            <div>
                <label class="block text-xs font-bold text-gray-700 mb-1 uppercase">Password</label>
                <input type="password" required id="adminPass" class="w-full px-4 py-3 border rounded-lg focus:border-brand-yellow bg-gray-50" placeholder="••••••••">
            </div>
            <button type="submit" id="loginBtn" class="w-full bg-brand-yellow text-brand-black font-extrabold py-3.5 rounded-lg shadow-sm hover:scale-[1.02] transition">Login to Dashboard</button>
        </form>
    </div>

    <!-- MAIN DASHBOARD -->
    <div id="dashboard-screen" class="hidden w-full h-full flex flex-col md:flex-row overflow-hidden">
        
        <!-- MOBILE TOP BAR -->
        <div class="md:hidden bg-brand-black text-white p-3 flex justify-between items-center shadow-md z-50">
            <span class="text-brand-yellow font-extrabold text-lg">Taara <span class="text-white text-xs">Admin</span></span>
            <div class="flex gap-1.5">
                <button onclick="switchTab('add')" id="mob-tab-add" class="mob-tab-btn mob-tab-active text-[10px] px-2.5 py-1.5 bg-brand-yellow text-brand-black rounded font-bold transition">➕ Add</button>
                <button onclick="switchTab('manage')" id="mob-tab-manage" class="mob-tab-btn text-[10px] px-2.5 py-1.5 bg-white/10 text-gray-300 rounded font-bold transition">📦 Manage</button>
                <button onclick="logout()" class="text-[10px] px-2.5 py-1.5 bg-red-500/20 text-red-400 rounded font-bold transition">Log Out</button>
            </div>
        </div>

        <!-- DESKTOP SIDEBAR -->
        <div class="hidden md:flex w-64 bg-brand-black text-white flex-col flex-shrink-0">
            <div class="p-6 border-b border-gray-800 text-center">
                <span class="text-brand-yellow font-extrabold text-xl">Taara</span> <span class="text-white text-md font-semibold">Admin</span>
                <p class="text-xs text-gray-400 mt-2" id="welcomeName">Welcome</p>
            </div>
            <nav class="flex-1 p-4 space-y-2">
                <button onclick="switchTab('add')" id="tab-add" class="tab-btn tab-active w-full text-left px-4 py-3 font-bold rounded-lg transition flex items-center gap-2">➕ Publish Package</button>
                <button onclick="switchTab('manage')" id="tab-manage" class="tab-btn w-full text-left px-4 py-3 text-gray-400 hover:text-white hover:bg-white/5 rounded-lg transition flex items-center gap-2">📦 Manage Packages</button>
                <a href="index.html" target="_blank" class="w-full text-left px-4 py-3 text-gray-400 hover:text-white hover:bg-white/5 rounded-lg transition flex items-center gap-2 block">🌐 View Website</a>
            </nav>
            <div class="p-4 border-t border-gray-800"><button onclick="logout()" class="w-full px-4 py-2 text-red-400 hover:bg-red-400/10 rounded-lg transition font-semibold text-sm">Log Out</button></div>
        </div>

        <!-- WORKSPACE -->
        <div class="flex-1 overflow-y-auto bg-gray-50 p-4 md:p-10 relative">
            <div id="view-add" class="max-w-4xl mx-auto bg-white rounded-2xl shadow-sm border border-gray-200 p-5 md:p-8 transition-all">
                
                <!-- GEMINI AI ASSISTANT BANNER -->
                <div class="bg-gradient-to-r from-gray-900 to-brand-black p-4 rounded-xl text-white mb-6 flex flex-col md:flex-row justify-between items-center gap-4 shadow-md">
                    <div>
                        <span class="bg-brand-yellow text-brand-black text-[10px] font-extrabold px-2 py-0.5 rounded uppercase">Secure Gemini AI</span>
                        <h3 class="font-bold text-sm mt-1">Need help writing itineraries or descriptions?</h3>
                        <p class="text-xs text-gray-300">Powered via secure backend connection for instant generation.</p>
                    </div>
                    <div class="flex gap-2 w-full md:w-auto">
                        <input type="text" id="ai-prompt-input" placeholder="e.g. 4 Days Goa Tour..." class="px-3 py-1.5 rounded text-xs text-black outline-none flex-1 md:w-48">
                        <button type="button" onclick="askGeminiAI()" class="bg-brand-yellow text-brand-black font-bold px-4 py-1.5 rounded text-xs hover:bg-yellow-400 transition whitespace-nowrap">✨ Generate with AI</button>
                    </div>
                </div>

                <h2 id="form-header-title" class="text-xl md:text-2xl font-extrabold text-gray-900 border-b pb-4 mb-6 flex items-center gap-2">
                    <span class="w-2 h-6 bg-brand-yellow rounded-full"></span> Launch New Package
                </h2>
                
                <form id="addPackageForm" onsubmit="submitPackage(event)" class="space-y-6 md:space-y-8">
                    <input type="hidden" id="editPackageId" value=""><input type="hidden" id="formMode" value="add"> 

                    <div class="bg-gray-50 p-4 md:p-5 rounded-xl border border-gray-100 grid grid-cols-1 md:grid-cols-2 gap-4 md:gap-5">
                        <div class="md:col-span-2">
                            <label class="block text-xs font-bold text-gray-700 mb-1 uppercase">Package Title *</label>
                            <input type="text" id="pTitle" required placeholder="e.g. Dubai Premium Tour" class="w-full px-4 py-2.5 border rounded-lg focus:border-brand-yellow outline-none bg-white">
                        </div>
                        
                        <div class="bg-white border border-brand-yellow p-3 rounded-lg">
                            <label class="block text-xs font-bold text-brand-black mb-1 uppercase">Select Category *</label>
                            <select id="pCategory" required onchange="updateDestinations()" class="w-full px-4 py-2.5 border border-gray-200 rounded-lg focus:border-brand-yellow outline-none bg-gray-50 font-bold text-sm">
                                <option value="India">🇮🇳 India</option>
                                <option value="International">🌍 International</option>
                            </select>
                        </div>
                        <div class="bg-white border border-brand-yellow p-3 rounded-lg">
                            <label class="block text-xs font-bold text-brand-black mb-1 uppercase">Location / Destination *</label>
                            <input list="dest-list" id="pLocation" required placeholder="Type to search..." class="w-full px-4 py-2.5 border border-gray-200 rounded-lg focus:border-brand-yellow outline-none bg-gray-50 font-bold text-sm">
                            <datalist id="dest-list"></datalist>
                        </div>

                        <!-- TOUR TYPE & TIERED PRICING -->
                        <div class="md:col-span-2 bg-white border border-gray-300 p-4 rounded-lg space-y-3">
                            <div class="flex justify-between items-center">
                                <label class="block text-xs font-bold text-brand-black uppercase">Tour Type *</label>
                                <label class="flex items-center gap-2 text-xs font-bold text-brand-black cursor-pointer bg-yellow-50 px-3 py-1 rounded border border-yellow-200">
                                    <input type="checkbox" id="enableTierToggle" onchange="toggleTierPricing()" class="w-4 h-4 accent-brand-black"> 🎛️ Enable Tiered / Adult / Child Pricing
                                </label>
                            </div>
                            <select id="pTourType" required class="w-full px-4 py-2.5 border border-gray-200 rounded-lg focus:border-brand-yellow outline-none bg-gray-50 font-bold text-sm">
                                <option value="Group Tour">👥 Group Tour</option>
                                <option value="Private Tour">🚗 Private Tour</option>
                                <option value="Customized Tour">✨ Customized Tour</option>
                            </select>

                            <div id="tierPricingContainer" class="hidden grid grid-cols-2 md:grid-cols-4 gap-3 pt-3 border-t border-gray-100">
                                <div><label class="block text-[10px] font-bold text-gray-600 uppercase">1 Person Rate</label><input type="number" id="tier1" placeholder="₹" class="w-full p-2 border rounded text-xs bg-gray-50"></div>
                                <div><label class="block text-[10px] font-bold text-gray-600 uppercase">2 Person Rate</label><input type="number" id="tier2" placeholder="₹" class="w-full p-2 border rounded text-xs bg-gray-50"></div>
                                <div><label class="block text-[10px] font-bold text-gray-600 uppercase">4 Person Rate</label><input type="number" id="tier4" placeholder="₹" class="w-full p-2 border rounded text-xs bg-gray-50"></div>
                                <div><label class="block text-[10px] font-bold text-gray-600 uppercase">6 Person Rate</label><input type="number" id="tier6" placeholder="₹" class="w-full p-2 border rounded text-xs bg-gray-50"></div>
                                <div><label class="block text-[10px] font-bold text-gray-600 uppercase">8+ Person Rate</label><input type="number" id="tier8" placeholder="₹" class="w-full p-2 border rounded text-xs bg-gray-50"></div>
                                <div><label class="block text-[10px] font-bold text-gray-600 uppercase">Extra Adult</label><input type="number" id="tierExtraAdult" placeholder="₹" class="w-full p-2 border rounded text-xs bg-gray-50"></div>
                                <div><label class="block text-[10px] font-bold text-gray-600 uppercase">Child w/ Mattress</label><input type="number" id="tierChildBed" placeholder="₹" class="w-full p-2 border rounded text-xs bg-gray-50"></div>
                                <div><label class="block text-[10px] font-bold text-gray-600 uppercase">Child w/o Mattress</label><input type="number" id="tierChildNoBed" placeholder="₹" class="w-full p-2 border rounded text-xs bg-gray-50"></div>
                            </div>
                        </div>

                        <div>
                            <label class="block text-xs font-bold text-gray-700 mb-1 uppercase">Base Price (Numbers Only) *</label>
                            <input type="number" id="pPrice" required class="w-full px-4 py-2.5 border rounded-lg focus:border-brand-yellow outline-none bg-white">
                        </div>
                        <div>
                            <label class="block text-xs font-bold text-gray-700 mb-1 uppercase">Duration *</label>
                            <input type="text" id="pDuration" required placeholder="e.g. 5 Days 4 Nights" class="w-full px-4 py-2.5 border rounded-lg focus:border-brand-yellow outline-none bg-white">
                        </div>
                        <div class="md:col-span-2">
                            <label class="block text-xs font-bold text-gray-700 mb-1 uppercase">Cover Image Link *</label>
                            <input type="url" id="pImage" required class="w-full px-4 py-2.5 border rounded-lg focus:border-brand-yellow outline-none bg-white">
                        </div>

                        <!-- COUNTDOWN OFFER TIMER TOGGLE -->
                        <div class="md:col-span-2 bg-yellow-50/50 border border-yellow-200 p-4 rounded-lg space-y-3">
                            <label class="flex items-center gap-2 text-xs font-bold text-brand-black cursor-pointer">
                                <input type="checkbox" id="enableOfferTimer" onchange="toggleOfferTimer()" class="w-4 h-4 accent-brand-black"> ⏳ Enable Limited Time Offer Timer on Package
                            </label>
                            <div id="offerTimerFields" class="hidden grid grid-cols-1 md:grid-cols-2 gap-3 pt-2">
                                <div>
                                    <label class="block text-[10px] font-bold text-gray-600 uppercase">Offer Expiry Date & Time</label>
                                    <input type="datetime-local" id="offerExpiry" class="w-full p-2 border rounded text-xs bg-white">
                                </div>
                                <div>
                                    <label class="block text-[10px] font-bold text-gray-600 uppercase">Offer Badge Text</label>
                                    <input type="text" id="offerText" placeholder="e.g. Diwali Flash Sale / Early Bird Discount" class="w-full p-2 border rounded text-xs bg-white">
                                </div>
                            </div>
                        </div>
                    </div>

                    <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
                        <div>
                            <label class="block text-xs font-bold text-green-700 mb-1 uppercase">Inclusions (Press Enter for new line) *</label>
                            <textarea id="pInc" required rows="4" class="w-full px-4 py-2.5 border border-green-200 rounded-lg focus:border-green-500 outline-none bg-green-50/30"></textarea>
                        </div>
                        <div>
                            <label class="block text-xs font-bold text-red-700 mb-1 uppercase">Exclusions (Press Enter for new line) *</label>
                            <textarea id="pExc" required rows="4" class="w-full px-4 py-2.5 border border-red-200 rounded-lg focus:border-red-500 outline-none bg-red-50/30"></textarea>
                        </div>
                    </div>

                    <div>
                        <div class="flex justify-between items-center mb-3 border-b pb-2">
                            <label class="block text-sm font-bold text-gray-900 uppercase">Day-wise Itinerary *</label>
                            <button type="button" onclick="addDay()" class="text-xs font-bold bg-brand-black text-white px-3 py-1.5 rounded-lg">➕ Add Day</button>
                        </div>
                        <div id="itinerary-container" class="space-y-4"></div>
                    </div>

                    <div class="bg-gray-50 p-4 rounded-lg border border-gray-200">
                        <label class="block text-xs font-bold text-gray-700 mb-1 uppercase">Google Drive PDF Link (Optional)</label>
                        <input type="url" id="pPdf" class="w-full px-4 py-2 border rounded-lg focus:border-brand-yellow outline-none bg-white">
                    </div>

                    <div id="form-msg" class="hidden text-sm font-bold text-left p-4 rounded-lg border"></div>

                    <div class="flex gap-4">
                        <button type="submit" id="addBtn" class="flex-1 bg-brand-yellow text-brand-black font-extrabold py-4 rounded-xl shadow-md transition">🚀 Publish Package</button>
                        <button type="button" id="cancelEditBtn" onclick="resetFormToAdd()" class="hidden flex-none bg-gray-200 text-gray-800 font-bold py-4 px-6 rounded-xl hover:bg-gray-300 transition">Cancel</button>
                    </div>
                </form>
            </div>

            <div id="view-manage" class="hidden max-w-5xl mx-auto transition-all">
                <div class="flex justify-between items-center mb-6">
                    <h2 class="text-xl md:text-2xl font-extrabold text-gray-900"><span class="w-2 h-6 bg-brand-yellow rounded-full inline-block align-middle mr-2"></span> Manage Packages</h2>
                    <button onclick="loadPackages()" class="text-sm bg-white border border-gray-300 font-bold px-3 py-1.5 rounded-lg hover:bg-gray-50">🔄 Refresh</button>
                </div>
                <div class="bg-white rounded-2xl shadow-sm border border-gray-200 overflow-x-auto">
                    <table class="w-full text-left border-collapse whitespace-nowrap md:whitespace-normal">
                        <thead><tr class="bg-gray-50 border-b text-xs uppercase text-gray-500 font-bold"><th class="p-4">Title & Details</th><th class="p-4">Price</th><th class="p-4 text-center">Actions</th></tr></thead>
                        <tbody id="package-table-body" class="text-sm divide-y divide-gray-100"></tbody>
                    </table>
                </div>
            </div>
        </div>
    </div>

    <script>
        const scriptURL = 'https://script.google.com/macros/s/AKfycbzQnA9tbeVeG-TqIQ1UzoSMh9dtGvmbhU7twWs-9vooHCc9DnNv1QAWtall8q8OfxRicw/exec';
        
        const indiaList = ["Andaman", "Andhra Pradesh", "Arunachal", "Assam", "Ayodhya", "Bihar", "Chandigarh", "Coorg", "Darjeeling", "Delhi", "Goa", "Gujarat", "Himachal Pradesh", "Jammu and Kashmir", "Karnataka", "Kerala", "Kutch", "Ladakh", "Lakshadweep", "Lonavala", "Madhya Pradesh", "Mahabaleshwar", "Maharashtra", "Manali", "Meghalaya", "Mumbai", "Odisha", "Punjab", "Rajasthan", "Rishikesh", "Sikkim", "Shimla", "Tamil Nadu", "Udaipur", "Ujjain", "Uttarakhand", "Uttar Pradesh", "Varanasi", "West Bengal"];
        const intlList = ["Almaty", "Australia", "Azerbaijan", "Baku", "Bali", "Bhutan", "Cambodia", "Canada", "Dubai", "Egypt", "Europe", "France", "Germany", "Greece", "Hong Kong", "Indonesia", "Italy", "Japan", "Kenya", "Malaysia", "Maldives", "Mauritius", "Nepal", "New Zealand", "Oman", "Philippines", "Qatar", "Russia", "Saudi Arabia", "Seychelles", "Singapore", "South Africa", "South Korea", "Spain", "Sri Lanka", "Switzerland", "Thailand", "Turkey", "USA", "UK", "Vietnam"];
        
        let allPackagesData = []; 

        function toggleTierPricing() {
            const isChecked = document.getElementById('enableTierToggle').checked;
            document.getElementById('tierPricingContainer').classList.toggle('hidden', !isChecked);
        }

        function toggleOfferTimer() {
            const isChecked = document.getElementById('enableOfferTimer').checked;
            document.getElementById('offerTimerFields').classList.toggle('hidden', !isChecked);
        }

        // SECURE GEMINI AI CALL VIA BACKEND
        function askGeminiAI() {
            const prompt = document.getElementById('ai-prompt-input').value.trim();
            if(!prompt) { alert("Please type a topic or destination for AI (e.g., Goa 4 Days)"); return; }
            
            const btn = event.target;
            btn.innerText = "Gemini is writing...";
            
            fetch(scriptURL, {
                method: 'POST',
                body: JSON.stringify({ action: "generate_ai", prompt: prompt }),
                headers: { 'Content-Type': 'text/plain;charset=utf-8' }
            })
            .then(res => res.json())
            .then(data => {
                btn.innerText = "✨ Generate with AI";
                if(data.result === 'success' && data.aiData) {
                    const aiData = data.aiData;
                    document.getElementById('pTitle').value = aiData.title || prompt;
                    document.getElementById('pInc').value = (aiData.inclusions || "").replace(/,\s*/g, '\n');
                    document.getElementById('pExc').value = (aiData.exclusions || "").replace(/,\s*/g, '\n');

                    const container = document.getElementById('itinerary-container');
                    container.innerHTML = '';
                    if(aiData.itinerary && Array.isArray(aiData.itinerary)) {
                        aiData.itinerary.forEach(day => {
                            addDay(null, day.title || "Tour Day", day.description || "", "Breakfast,Dinner");
                        });
                    } else {
                        addDay(null, "Day 1", "Explore local attractions.", "Breakfast");
                    }
                    alert("Gemini AI successfully generated the package details!");
                } else {
                    alert("AI Generation failed. Please try again.");
                }
            })
            .catch(err => {
                btn.innerText = "✨ Generate with AI";
                alert("Network error during AI generation.");
            });
        }

        function updateDestinations() {
            const cat = document.getElementById('pCategory').value;
            const dataList = document.getElementById('dest-list');
            dataList.innerHTML = '';
            (cat === 'India' ? indiaList : intlList).forEach(d => dataList.innerHTML += `<option value="${d}">`);
        }
        window.onload = () => { updateDestinations(); if(localStorage.getItem('taara_admin_logged_in') === 'true') showDashboard(localStorage.getItem('taara_admin_name')); };

        function showDashboard(name) {
            document.getElementById('login-screen').classList.add('hidden');
            document.getElementById('dashboard-screen').classList.remove('hidden');
            document.getElementById('body-container').classList.remove('items-center', 'justify-center');
            document.getElementById('welcomeName').innerText = "Welcome, " + (name || "Admin");
            if(document.getElementById('itinerary-container').children.length === 0){ addDay(); }
        }

        function logout() { localStorage.clear(); location.reload(); }

        function handleLogin(e) {
            e.preventDefault();
            const btn = document.getElementById('loginBtn'); const errBox = document.getElementById('login-error');
            btn.innerText = "Authenticating..."; errBox.classList.add('hidden');
            fetch(scriptURL, { method: 'POST', body: JSON.stringify({ action: "login", email: document.getElementById('adminEmail').value, password: document.getElementById('adminPass').value }), headers: { 'Content-Type': 'text/plain;charset=utf-8' }
            }).then(res => res.json()).then(data => {
                if(data.result === 'success') { localStorage.setItem('taara_admin_logged_in', 'true'); localStorage.setItem('taara_admin_name', data.name); showDashboard(data.name); } 
                else { errBox.innerText = "Invalid Credentials!"; errBox.classList.remove('hidden'); btn.innerText = "Login to Dashboard"; }
            });
        }

        function switchTab(tabName, isEditing = false) {
            document.querySelectorAll('.tab-btn').forEach(btn => { btn.classList.remove('tab-active'); btn.classList.add('text-gray-400'); });
            document.getElementById('tab-' + tabName).classList.add('tab-active'); document.getElementById('tab-' + tabName).classList.remove('text-gray-400');
            
            document.querySelectorAll('.mob-tab-btn').forEach(btn => { btn.classList.remove('mob-tab-active'); btn.classList.replace('text-brand-black', 'text-gray-300'); btn.classList.replace('bg-brand-yellow', 'bg-white/10'); });
            document.getElementById('mob-tab-' + tabName).classList.add('mob-tab-active');
            document.getElementById('mob-tab-' + tabName).classList.replace('text-gray-300', 'text-brand-black');
            document.getElementById('mob-tab-' + tabName).classList.replace('bg-white/10', 'bg-brand-yellow');

            document.getElementById('view-add').classList.add('hidden'); document.getElementById('view-manage').classList.add
