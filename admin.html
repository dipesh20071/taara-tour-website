<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Taara Tours - Premium Admin Panel</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Inter', sans-serif; background-color: #f3f4f6; }
        .bg-brand-yellow { background-color: #FFC500; }
        .text-brand-yellow { color: #FFC500; }
        .bg-brand-black { background-color: #1A1A1A; }
    </style>
</head>
<body class="text-gray-800 h-screen flex items-center justify-center" id="body-container">

    <!-- 1. LOGIN SCREEN -->
    <div id="login-screen" class="w-full max-w-md bg-white p-8 rounded-2xl shadow-xl border border-gray-100">
        <div class="text-center mb-8">
            <div class="bg-brand-black inline-block px-4 py-2 rounded-lg border-b-4 border-brand-yellow mb-4">
                <span class="text-brand-yellow font-extrabold text-2xl">Taara</span> <span class="text-white text-lg font-semibold">Admin</span>
            </div>
            <p class="text-gray-500 text-sm">Secure Staff Portal</p>
        </div>

        <form id="loginForm" onsubmit="handleLogin(event)" class="space-y-5">
            <div id="login-error" class="hidden text-sm text-red-600 bg-red-50 p-3 rounded-lg font-semibold text-center"></div>
            
            <div>
                <label class="block text-xs font-bold text-gray-700 mb-1 uppercase tracking-wide">Email Address</label>
                <input type="email" required id="adminEmail" class="w-full px-4 py-3 border border-gray-200 rounded-lg focus:outline-none focus:border-brand-yellow bg-gray-50" placeholder="admin@taaratour.in">
            </div>
            <div>
                <label class="block text-xs font-bold text-gray-700 mb-1 uppercase tracking-wide">Password</label>
                <input type="password" required id="adminPass" class="w-full px-4 py-3 border border-gray-200 rounded-lg focus:outline-none focus:border-brand-yellow bg-gray-50" placeholder="••••••••">
            </div>
            <button type="submit" id="loginBtn" class="w-full bg-brand-yellow text-brand-black font-extrabold py-3.5 rounded-lg shadow-sm hover:scale-[1.02] transition">
                Login to Dashboard
            </button>
        </form>
    </div>

    <!-- 2. MAIN DASHBOARD (Hidden initially) -->
    <div id="dashboard-screen" class="hidden w-full h-full flex flex-col md:flex-row">
        
        <!-- Sidebar -->
        <div class="w-full md:w-64 bg-brand-black text-white flex flex-col">
            <div class="p-6 border-b border-gray-800 text-center">
                <span class="text-brand-yellow font-extrabold text-xl">Taara</span> <span class="text-white text-md font-semibold">Admin</span>
                <p class="text-xs text-gray-400 mt-2" id="welcomeName">Welcome, Admin</p>
            </div>
            <nav class="flex-1 p-4 space-y-2">
                <button class="w-full text-left px-4 py-3 bg-white/10 text-brand-yellow font-bold rounded-lg transition flex items-center gap-2">
                    ➕ Add New Package
                </button>
                <a href="index.html" target="_blank" class="w-full text-left px-4 py-3 text-gray-400 hover:text-white hover:bg-white/5 rounded-lg transition flex items-center gap-2 block">
                    🌐 View Website
                </a>
            </nav>
            <div class="p-4 border-t border-gray-800">
                <button onclick="logout()" class="w-full px-4 py-2 text-red-400 hover:bg-red-400/10 rounded-lg transition font-semibold text-sm">Log Out</button>
            </div>
        </div>

        <!-- Main Workspace -->
        <div class="flex-1 overflow-y-auto bg-gray-50 p-6 md:p-10">
            <div class="max-w-4xl mx-auto bg-white rounded-2xl shadow-sm border border-gray-200 p-6 md:p-8">
                <h2 class="text-2xl font-extrabold text-gray-900 border-b pb-4 mb-6 flex items-center gap-2">
                    <span class="w-2 h-6 bg-brand-yellow rounded-full"></span> Launch New Package
                </h2>
                
                <form id="addPackageForm" onsubmit="addPackage(event)" class="space-y-8">
                    
                    <!-- Basic Details -->
                    <div class="bg-gray-50 p-5 rounded-xl border border-gray-100 grid grid-cols-1 md:grid-cols-2 gap-5">
                        <div class="md:col-span-2">
                            <label class="block text-xs font-bold text-gray-700 mb-1 uppercase">Package Title *</label>
                            <input type="text" id="pTitle" required placeholder="e.g. Dubai Premium Tour" class="w-full px-4 py-2.5 border rounded-lg focus:border-brand-yellow focus:ring-1 focus:ring-brand-yellow outline-none bg-white">
                        </div>
                        <div>
                            <label class="block text-xs font-bold text-gray-700 mb-1 uppercase">Location *</label>
                            <input type="text" id="pLocation" required placeholder="e.g. Dubai, Abu Dhabi" class="w-full px-4 py-2.5 border rounded-lg focus:border-brand-yellow focus:ring-1 focus:ring-brand-yellow outline-none bg-white">
                        </div>
                        <div>
                            <label class="block text-xs font-bold text-gray-700 mb-1 uppercase">Price (Numbers Only) *</label>
                            <input type="number" id="pPrice" required placeholder="e.g. 25000" class="w-full px-4 py-2.5 border rounded-lg focus:border-brand-yellow focus:ring-1 focus:ring-brand-yellow outline-none bg-white">
                        </div>
                        <div>
                            <label class="block text-xs font-bold text-gray-700 mb-1 uppercase">Duration *</label>
                            <input type="text" id="pDuration" required placeholder="e.g. 5 Days 4 Nights" class="w-full px-4 py-2.5 border rounded-lg focus:border-brand-yellow focus:ring-1 focus:ring-brand-yellow outline-none bg-white">
                        </div>
                        <div>
                            <label class="block text-xs font-bold text-gray-700 mb-1 uppercase">Cover Image Link *</label>
                            <input type="url" id="pImage" required placeholder="https://unsplash.com/..." class="w-full px-4 py-2.5 border rounded-lg focus:border-brand-yellow focus:ring-1 focus:ring-brand-yellow outline-none bg-white">
                        </div>
                    </div>

                    <!-- Inclusions & Exclusions -->
                    <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
                        <div>
                            <label class="block text-xs font-bold text-green-700 mb-1 uppercase">Inclusions (Press Enter for new line) *</label>
                            <textarea id="pInc" required rows="4" placeholder="Hotels&#10;Breakfast&#10;Cab&#10;Safari..." class="w-full px-4 py-2.5 border border-green-200 rounded-lg focus:border-green-500 focus:ring-1 focus:ring-green-500 outline-none bg-green-50/30 leading-relaxed"></textarea>
                        </div>
                        <div>
                            <label class="block text-xs font-bold text-red-700 mb-1 uppercase">Exclusions (Press Enter for new line) *</label>
                            <textarea id="pExc" required rows="4" placeholder="Flights&#10;Lunch&#10;Personal Expenses..." class="w-full px-4 py-2.5 border border-red-200 rounded-lg focus:border-red-500 focus:ring-1 focus:ring-red-500 outline-none bg-red-50/30 leading-relaxed"></textarea>
                        </div>
                    </div>

                    <!-- SMART ITINERARY BUILDER -->
                    <div>
                        <div class="flex justify-between items-center mb-3 border-b pb-2">
                            <label class="block text-sm font-bold text-gray-900 uppercase">Day-wise Itinerary Builder *</label>
                            <!-- Top Add Button -->
                            <button type="button" onclick="addDay()" class="text-xs font-bold bg-brand-black text-white px-3 py-1.5 rounded-lg flex items-center gap-1 hover:bg-gray-800 transition">
                                ➕ Add Day at Bottom
                            </button>
                        </div>
                        
                        <div id="itinerary-container" class="space-y-4">
                            <!-- Days will be generated by JS on load -->
                        </div>
                    </div>

                    <!-- PDF Link -->
                    <div class="bg-gray-50 p-4 rounded-lg border border-gray-200">
                        <label class="block text-xs font-bold text-gray-700 mb-1 uppercase">Google Drive PDF Link (Optional)</label>
                        <input type="url" id="pPdf" placeholder="https://drive.google.com/..." class="w-full px-4 py-2 border rounded-lg focus:border-brand-yellow outline-none bg-white">
                    </div>

                    <!-- Status Message Box -->
                    <div id="form-msg" class="hidden text-sm font-bold text-left p-4 rounded-lg border"></div>

                    <button type="submit" id="addBtn" class="w-full md:w-auto px-10 bg-brand-yellow text-brand-black font-extrabold py-4 rounded-xl shadow-md hover:-translate-y-0.5 transition flex justify-center items-center gap-2 text-lg">
                        🚀 Publish Package to Website
                    </button>
                </form>
            </div>
        </div>
    </div>

    <script>
        // =====================================
        // AAPKI PERMANENT GOOGLE SCRIPT URL
        const scriptURL = 'https://script.google.com/macros/s/AKfycbzQnA9tbeVeG-TqIQ1UzoSMh9dtGvmbhU7twWs-9vooHCc9DnNv1QAWtall8q8OfxRicw/exec';
        // =====================================

        const loginScreen = document.getElementById('login-screen');
        const dashScreen = document.getElementById('dashboard-screen');
        const bodyCont = document.getElementById('body-container');

        // Itinerary HTML template with No Meal option
        function getDayHTML() {
            return `
                <div class="day-entry bg-white p-4 rounded-xl border border-gray-200 shadow-sm relative group mt-4 transition-all">
                    <div class="flex justify-between items-center mb-3">
                        <span class="day-number bg-brand-yellow text-brand-black text-xs font-bold px-2 py-1 rounded">Day X</span>
                        <div class="flex items-center gap-1.5 md:gap-3">
                            <button type="button" onclick="moveUp(this)" class="move-up-btn text-gray-400 hover:text-brand-black transition" title="Move Up">⬆️</button>
                            <button type="button" onclick="moveDown(this)" class="move-down-btn text-gray-400 hover:text-brand-black transition" title="Move Down">⬇️</button>
                            <button type="button" onclick="addDay(this)" class="text-green-600 hover:text-green-800 font-bold text-[10px] md:text-xs flex items-center gap-1 bg-green-50 px-2 py-1 rounded transition">➕ Add Next</button>
                            <button type="button" onclick="removeDay(this)" class="remove-btn text-red-500 hover:text-red-700 font-bold text-[10px] md:text-xs flex items-center gap-1 bg-red-50 px-2 py-1 rounded transition">🗑️ Drop</button>
                        </div>
                    </div>
                    <input type="text" placeholder="Day Title (e.g. City Tour)" required class="day-title w-full px-3 py-2 border rounded-md mb-3 text-sm focus:border-brand-yellow outline-none bg-gray-50">
                    <textarea placeholder="Day Description (Press Enter for new lines)..." required class="day-desc w-full px-3 py-2 border rounded-md text-sm focus:border-brand-yellow outline-none bg-gray-50 leading-relaxed" rows="3"></textarea>
                    
                    <!-- PREMIUM MEAL OPTIONS (INCLUDING NO MEAL) -->
                    <div class="mt-4 flex flex-wrap items-center gap-3 border-t border-gray-100 pt-3">
                        <span class="text-[10px] font-extrabold text-gray-500 uppercase tracking-widest">Meals:</span>
                        <label class="flex items-center gap-1.5 text-xs font-bold cursor-pointer text-gray-700 hover:text-gray-900 transition"><input type="checkbox" value="No Meal" class="meal-check w-4 h-4 accent-gray-600 cursor-pointer"> No Meal</label>
                        <label class="flex items-center gap-1.5 text-xs font-bold cursor-pointer text-gray-700 hover:text-green-600 transition"><input type="checkbox" value="Breakfast" class="meal-check w-4 h-4 accent-green-600 cursor-pointer"> Breakfast</label>
                        <label class="flex items-center gap-1.5 text-xs font-bold cursor-pointer text-gray-700 hover:text-orange-500 transition"><input type="checkbox" value="Lunch" class="meal-check w-4 h-4 accent-orange-500 cursor-pointer"> Lunch</label>
                        <label class="flex items-center gap-1.5 text-xs font-bold cursor-pointer text-gray-700 hover:text-purple-600 transition"><input type="checkbox" value="Hi-Tea" class="meal-check w-4 h-4 accent-purple-600 cursor-pointer"> Hi-Tea</label>
                        <label class="flex items-center gap-1.5 text-xs font-bold cursor-pointer text-gray-700 hover:text-blue-600 transition"><input type="checkbox" value="Dinner" class="meal-check w-4 h-4 accent-blue-600 cursor-pointer"> Dinner</label>
                    </div>
                </div>
            `;
        }

        // Login Logic
        if(localStorage.getItem('taara_admin_logged_in') === 'true') {
            showDashboard(localStorage.getItem('taara_admin_name'));
        }

        function showDashboard(name) {
            loginScreen.classList.add('hidden');
            dashScreen.classList.remove('hidden');
            bodyCont.classList.remove('items-center', 'justify-center');
            document.getElementById('welcomeName').innerText = "Welcome, " + (name || "Admin");
            // Setup Day 1 if empty
            if(document.getElementById('itinerary-container').children.length === 0){ addDay(); }
        }

        function logout() {
            localStorage.removeItem('taara_admin_logged_in');
            localStorage.removeItem('taara_admin_name');
            location.reload();
        }

        function handleLogin(e) {
            e.preventDefault();
            const btn = document.getElementById('loginBtn');
            const errBox = document.getElementById('login-error');
            btn.innerText = "Authenticating...";
            errBox.classList.add('hidden');

            fetch(scriptURL, {
                method: 'POST',
                body: JSON.stringify({
                    action: "login",
                    email: document.getElementById('adminEmail').value,
                    password: document.getElementById('adminPass').value
                }),
                headers: { 'Content-Type': 'text/plain;charset=utf-8' }
            }).then(res => res.text()).then(text => {
                try {
                    const data = JSON.parse(text);
                    if(data.result === 'success') {
                        localStorage.setItem('taara_admin_logged_in', 'true');
                        localStorage.setItem('taara_admin_name', data.name);
                        showDashboard(data.name);
                    } else {
                        errBox.innerText = data.message || "Invalid Credentials!";
                        errBox.classList.remove('hidden');
                        btn.innerText = "Login to Dashboard";
                    }
                } catch(err) {
                    errBox.innerText = "Error parsing response from script.";
                    errBox.classList.remove('hidden');
                    btn.innerText = "Login to Dashboard";
                }
            }).catch(err => {
                errBox.innerText = "Network Error: Please check internet.";
                errBox.classList.remove('hidden');
                btn.innerText = "Login to Dashboard";
            });
        }

        // Itinerary Up/Down/Add/Remove
        function addDay(btnElement = null) {
            const html = getDayHTML();
            if(btnElement) btnElement.closest('.day-entry').insertAdjacentHTML('afterend', html);
            else document.getElementById('itinerary-container').insertAdjacentHTML('beforeend', html);
            updateDayNumbers();
        }

        function removeDay(btnElement) {
            const container = document.getElementById('itinerary-container');
            if(container.children.length > 1) { btnElement.closest('.day-entry').remove(); updateDayNumbers(); }
        }

        function moveUp(btnElement) {
            const current = btnElement.closest('.day-entry');
            const prev = current.previousElementSibling;
            if(prev) { current.parentNode.insertBefore(current, prev); updateDayNumbers(); }
        }

        function moveDown(btnElement) {
            const current = btnElement.closest('.day-entry');
            const next = current.nextElementSibling;
            if(next) { current.parentNode.insertBefore(next, current); updateDayNumbers(); }
        }

        function updateDayNumbers() {
            const days = document.querySelectorAll('.day-entry');
            days.forEach((day, index) => {
                day.querySelector('.day-number').innerText = 'Day ' + (index + 1);
                
                const upBtn = day.querySelector('.move-up-btn');
                const downBtn = day.querySelector('.move-down-btn');
                const removeBtn = day.querySelector('.remove-btn');

                if(index === 0) upBtn.classList.add('opacity-30', 'cursor-not-allowed');
                else upBtn.classList.remove('opacity-30', 'cursor-not-allowed');

                if(index === days.length - 1) downBtn.classList.add('opacity-30', 'cursor-not-allowed');
                else downBtn.classList.remove('opacity-30', 'cursor-not-allowed');

                if(days.length === 1) removeBtn.classList.add('hidden');
                else removeBtn.classList.remove('hidden');
            });
        }

        // Publish to Google Sheet
        function addPackage(e) {
            e.preventDefault();
            const btn = document.getElementById('addBtn');
            const msgBox = document.getElementById('form-msg');
            btn.innerText = "Publishing to Website...";
            msgBox.classList.add('hidden');
            
            // SMART INCLUSION/EXCLUSION FIX (New line to comma for sheet storage)
            let incRaw = document.getElementById('pInc').value.trim();
            let excRaw = document.getElementById('pExc').value.trim();
            
            let finalInc = incRaw.replace(/\n/g, ', ').replace(/,+/g, ',').trim();
            let finalExc = excRaw.replace(/\n/g, ', ').replace(/,+/g, ',').trim();
            if(finalInc.endsWith(',')) finalInc = finalInc.slice(0, -1);
            if(finalExc.endsWith(',')) finalExc = finalExc.slice(0, -1);

            // SMART ITINERARY FORMATTER
            let itineraryArray = [];
            document.querySelectorAll('.day-entry').forEach(day => {
                let title = day.querySelector('.day-title').value.trim().replace(/\|/g, '').replace(/:/g, ''); 
                let descRaw = day.querySelector('.day-desc').value.trim().replace(/\|/g, '').replace(/:/g, '');
                
                if(title || descRaw) {
                    let formattedDesc = descRaw.replace(/\n/g, '<br>');
                    
                    let mealsHTML = '';
                    const mealChecks = day.querySelectorAll('.meal-check:checked');
                    if(mealChecks.length > 0) {
                        mealsHTML = `<span class="mt-3 flex flex-wrap items-center gap-2"><span class="text-[10px] text-gray-400 font-bold uppercase tracking-wider">Meals:</span>`;
                        mealChecks.forEach(chk => {
                            let type = chk.value;
                            let colors = '';
                            if(type === 'No Meal') colors = 'bg-gray-100 text-gray-600 border-gray-200';
                            else if(type === 'Breakfast') colors = 'bg-green-50 text-green-700 border-green-100';
                            else if(type === 'Lunch') colors = 'bg-orange-50 text-orange-700 border-orange-100';
                            else if(type === 'Hi-Tea') colors = 'bg-purple-50 text-purple-700 border-purple-100';
                            else if(type === 'Dinner') colors = 'bg-blue-50 text-blue-700 border-blue-100';

                            mealsHTML += `<span class="${colors} border text-[10px] font-bold px-2 py-1 rounded shadow-sm">${type}</span>`;
                        });
                        mealsHTML += `</span>`;
                    }
                    
                    itineraryArray.push(`${title} : ${formattedDesc}${mealsHTML}`);
                }
            });
            const compiledItinerary = itineraryArray.join(' | ');

            const payload = {
                action: "add_package",
                title: document.getElementById('pTitle').value,
                location: document.getElementById('pLocation').value,
                price: document.getElementById('pPrice').value,
                duration: document.getElementById('pDuration').value,
                imageUrl: document.getElementById('pImage').value,
                pdfLink: document.getElementById('pPdf').value,
                inclusions: finalInc,
                exclusions: finalExc,
                itinerary: compiledItinerary 
            };

            fetch(scriptURL, {
                method: 'POST',
                body: JSON.stringify(payload),
                headers: { 'Content-Type': 'text/plain;charset=utf-8' }
            }).then(res => res.text()).then(text => {
                try {
                    const data = JSON.parse(text);
                    msgBox.classList.remove('hidden');
                    if(data.result === 'success') {
                        msgBox.className = "text-sm font-bold p-4 rounded-xl bg-green-50 border border-green-200 text-green-700 block";
                        msgBox.innerHTML = `✅ <strong>Successfully Published!</strong><br><br>The package is now live. <a href="package.html?id=${data.newId}" target="_blank" class="underline text-green-800 ml-2">Click to view it live ↗</a>`;
                        document.getElementById('addPackageForm').reset();
                        document.getElementById('itinerary-container').innerHTML = ''; 
                        addDay(); 
                    } else {
                        msgBox.className = "text-sm font-bold p-4 rounded-xl bg-red-50 border border-red-200 text-red-700 block";
                        msgBox.innerHTML = `❌ <strong>Failed to publish:</strong><br><span class="font-normal mt-1 block">${data.message || data.error}</span>`;
                    }
                } catch(err) {
                    msgBox.classList.remove('hidden');
                    msgBox.className = "text-sm font-bold p-4 rounded-xl bg-red-50 border border-red-200 text-red-700 block";
                    msgBox.innerHTML = `❌ <strong>Google Connection Error</strong><br><span class="font-normal mt-1 block">Deploy your script correctly with 'Anyone' access.</span>`;
                }
                btn.innerHTML = "🚀 Publish Package to Website";
            }).catch(err => {
                msgBox.classList.remove('hidden');
                msgBox.className = "text-sm font-bold p-4 rounded-xl bg-red-50 border border-red-200 text-red-700 block";
                msgBox.innerHTML = `❌ <strong>Network Error!</strong><br><span class="font-normal mt-1 block">Check your internet connection.</span>`;
                btn.innerHTML = "🚀 Publish Package to Website";
            });
        }
    </script>
</body>
</html>
