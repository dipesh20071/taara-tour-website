<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tour Package | Taara Tour & Travels</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Inter', sans-serif; background-color: #f8f9fa; }
        .bg-taara-yellow { background-color: #FFC500; }
        .text-taara-yellow { color: #FFC500; }
        .bg-taara-black { background-color: #1A1A1A; }
        .text-taara-black { color: #1A1A1A; }
        #loader { display: flex; }
        #content { display: none; }
    </style>
</head>
<body class="pb-24 lg:pb-0 relative">

    <!-- Loading Overlay -->
    <div id="loader" class="fixed inset-0 bg-white z-[999] flex flex-col items-center justify-center">
        <div class="animate-spin rounded-full h-12 w-12 border-4 border-gray-200 border-t-taara-yellow mb-4"></div>
        <p class="text-gray-500 font-medium">Fetching Best Package Details...</p>
    </div>

    <!-- MAIN CONTENT (Hidden until data loads) -->
    <div id="content">
        <!-- Mobile Top Header -->
        <header class="bg-white shadow-sm sticky top-0 z-50 px-4 py-3 flex justify-between items-center lg:hidden">
            <div class="flex items-center gap-3">
                <a href="index.html" class="text-gray-700">
                    <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 19l-7-7 7-7"></path></svg>
                </a>
                <div class="h-8 w-24 bg-gray-200 rounded flex items-center justify-center text-xs font-bold text-gray-500">LOGO</div>
            </div>
            <div class="flex items-center gap-3">
                <button class="bg-taara-yellow text-taara-black font-semibold px-4 py-1.5 rounded-md text-sm shadow">Enquire</button>
            </div>
        </header>

        <main class="max-w-7xl mx-auto lg:px-4 lg:py-6 flex flex-col lg:flex-row gap-6">
            
            <div class="w-full lg:w-2/3">
                <!-- Dynamic Image -->
                <div class="relative w-full h-[60vh] lg:h-[70vh] lg:rounded-xl overflow-hidden bg-gray-200">
                    <img id="pkg-image" src="" class="w-full h-full object-cover object-center">
                    <div class="absolute inset-0 bg-gradient-to-b from-black/40 via-transparent to-black/60"></div>

                    <!-- Badges -->
                    <div class="absolute top-4 left-4 flex flex-col gap-2">
                        <span id="pkg-type" class="bg-taara-yellow text-taara-black text-xs font-bold px-3 py-1 rounded-md shadow-md inline-block w-max">Premium Tour</span>
                    </div>

                    <!-- Top Right Action Buttons -->
                    <div class="absolute top-4 right-4 flex gap-2">
                        <button onclick="openPdfModal()" class="w-10 h-10 bg-taara-yellow rounded-full flex items-center justify-center shadow-lg transform transition hover:scale-105" title="Download PDF">
                            <svg class="w-5 h-5 text-taara-black" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 16v1a3 3 0 003 3h10a3 3 0 003-3v-1m-4-4l-4 4m0 0l-4-4m4 4V4"></path></svg>
                        </button>
                        <a href="tel:7016036767" class="w-10 h-10 bg-taara-yellow rounded-full flex items-center justify-center shadow-lg transform transition hover:scale-105">
                            <svg class="w-5 h-5 text-taara-black" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 5a2 2 0 012-2h3.28a1 1 0 01.948.684l1.498 4.493a1 1 0 01-.502 1.21l-2.257 1.13a11.042 11.042 0 005.516 5.516l1.13-2.257a1 1 0 011.21-.502l4.493 1.498a1 1 0 01.684.949V19a2 2 0 01-2 2h-1C9.716 21 3 14.284 3 6V5z"></path></svg>
                        </a>
                        <a id="pkg-whatsapp" href="#" target="_blank" class="w-10 h-10 bg-taara-yellow rounded-full flex items-center justify-center shadow-lg transform transition hover:scale-105">
                            <svg class="w-6 h-6 text-taara-black" fill="currentColor" viewBox="0 0 24 24"><path d="M17.472 14.382c-.297-.149-1.758-.867-2.03-.967-.273-.099-.471-.148-.67.15-.197.297-.767.966-.94 1.164-.173.199-.347.223-.644.075-.297-.15-1.255-.463-2.39-1.475-.883-.788-1.48-1.761-1.653-2.059-.173-.297-.018-.458.13-.606.134-.133.298-.347.446-.52.149-.174.198-.298.298-.497.099-.198.05-.371-.025-.52-.075-.149-.669-1.612-.916-2.207-.242-.579-.487-.5-.669-.51a12.8 12.8 0 00-.57-.01c-.198 0-.52.074-.792.372-.272.297-1.04 1.016-1.04 2.479 0 1.462 1.065 2.875 1.213 3.074.149.198 2.096 3.2 5.077 4.487.709.306 1.262.489 1.694.625.712.227 1.36.195 1.871.118.571-.085 1.758-.719 2.006-1.413.248-.694.248-1.289.173-1.413-.074-.124-.272-.198-.57-.347m-5.421 7.403h-.004a9.87 9.87 0 01-5.031-1.378l-.361-.214-3.741.982.998-3.648-.235-.374a9.86 9.86 0 01-1.51-5.26c.001-5.45 4.436-9.884 9.888-9.884 2.64 0 5.122 1.03 6.988 2.898a9.825 9.825 0 012.893 6.994c-.003 5.45-4.437 9.884-9.885 9.884m8.413-18.297A11.815 11.815 0 0012.05 0C5.495 0 .16 5.335.157 11.892c0 2.096.547 4.142 1.588 5.945L.057 24l6.305-1.654a11.882 11.882 0 005.683 1.448h.005c6.554 0 11.89-5.335 11.893-11.893a11.821 11.821 0 00-3.48-8.413z"/></svg>
                        </a>
                    </div>
                </div>

                <!-- Dynamic Title Card -->
                <div class="relative z-10 -mt-12 mx-4 lg:mx-0 bg-white rounded-xl shadow-lg p-5 border-t-4 border-taara-yellow">
                    <div class="flex justify-between items-start">
                        <h1 id="pkg-title" class="text-2xl font-bold text-gray-900 leading-tight">Loading Title...</h1>
                    </div>
                    
                    <div class="flex items-center gap-4 mt-3 text-sm">
                        <div class="flex items-center text-orange-500 font-semibold">
                            <svg class="w-4 h-4 mr-1" fill="currentColor" viewBox="0 0 20 20"><path d="M9.049 2.927c.3-.921 1.603-.921 1.902 0l1.07 3.292a1 1 0 00.95.69h3.462c.969 0 1.371 1.24.588 1.81l-2.8 2.034a1 1 0 00-.364 1.118l1.07 3.292c.3.921-.755 1.688-1.54 1.118l-2.8-2.034a1 1 0 00-1.175 0l-2.8 2.034c-.784.57-1.838-.197-1.539-1.118l1.07-3.292a1 1 0 00-.364-1.118L2.98 8.72c-.783-.57-.38-1.81.588-1.81h3.461a1 1 0 00.951-.69l1.07-3.292z"></path></svg>
                            4.9
                        </div>
                        <div class="flex items-center text-gray-700 font-medium bg-gray-100 px-2 py-1 rounded">
                            <svg class="w-4 h-4 text-taara-yellow mr-1" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 3v1m0 16v1m9-9h-1M4 12H3m15.364 6.364l-.707-.707M6.343 6.343l-.707-.707m12.728 0l-.707.707M6.343 17.657l-.707.707M16 12a4 4 0 11-8 0 4 4 0 018 0z"></path></svg> 
                            <span id="pkg-duration">--</span>
                        </div>
                    </div>
                    <p id="pkg-location" class="text-gray-500 text-sm mt-3 border-t border-gray-100 pt-3">Loading Location...</p>
                </div>

                <!-- Mobile Pricing Card -->
                <div class="lg:hidden mx-4 mt-4 bg-white rounded-xl shadow border border-gray-100 p-5">
                    <div class="flex items-baseline gap-2">
                        <span class="text-sm text-taara-black font-semibold bg-taara-yellow/20 px-2 py-0.5 rounded border border-taara-yellow/50">Starting From</span>
                        <span id="pkg-price-mobile" class="text-2xl font-bold text-gray-900">₹--</span>
                    </div>
                </div>
            </div>

            <!-- Right Sidebar Desktop -->
            <div class="hidden lg:block w-1/3">
                <div class="sticky top-20 bg-white rounded-xl shadow-lg border border-gray-200 p-6 border-t-4 border-taara-yellow">
                    <div class="flex items-baseline gap-2 mb-4">
                        <span class="text-sm text-taara-black font-semibold bg-taara-yellow/20 px-2 py-0.5 rounded border border-taara-yellow/50">Starting From</span>
                        <span id="pkg-price-desktop" class="text-3xl font-bold text-gray-900">₹--</span>
                    </div>
                    
                    <button class="w-full bg-taara-yellow hover:bg-yellow-500 text-taara-black font-bold text-lg py-3 rounded-md shadow transition mb-3">
                        Book Now
                    </button>
                    <button onclick="openPdfModal()" class="w-full bg-taara-black hover:bg-gray-800 text-white font-semibold py-3 rounded-md shadow transition flex items-center justify-center gap-2">
                        <svg class="w-5 h-5 text-taara-yellow" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 16v1a3 3 0 003 3h10a3 3 0 003-3v-1m-4-4l-4 4m0 0l-4-4m4 4V4"></path></svg>
                        Download Itinerary PDF
                    </button>
                </div>
            </div>
        </main>

        <!-- Mobile Bottom Sticky Booking Bar -->
        <div class="lg:hidden fixed bottom-0 left-0 w-full bg-white shadow-[0_-4px_6px_-1px_rgba(0,0,0,0.1)] rounded-t-2xl px-4 py-3 z-50 border-t-2 border-taara-yellow flex justify-between items-center">
            <div>
                <p class="text-xs text-gray-500">Starting From</p>
                <p id="pkg-price-sticky" class="text-xl font-bold text-taara-black">₹--</p>
            </div>
            <button class="bg-taara-yellow text-taara-black font-bold px-8 py-2.5 rounded-lg shadow-md">Book Now</button>
        </div>
    </div>

    <!-- PDF Lead Capture Modal -->
    <div id="pdfModal" class="fixed inset-0 bg-black/70 z-[100] hidden items-center justify-center p-4 backdrop-blur-sm">
        <div class="bg-white rounded-xl shadow-2xl w-full max-w-md overflow-hidden relative">
            <button onclick="closePdfModal()" class="absolute top-3 right-3 text-gray-400 hover:text-gray-800 z-10">
                <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"></path></svg>
            </button>
            
            <div class="bg-taara-black p-5 text-center border-b-4 border-taara-yellow">
                <h3 class="text-xl font-bold text-white">Download Itinerary</h3>
                <p class="text-gray-400 text-sm mt-1">Get the complete day-wise plan instantly.</p>
            </div>
            
            <div id="pdfErrorMsg" class="hidden bg-red-50 border-l-4 border-red-500 p-6 m-2 rounded-r">
                <div class="flex flex-col items-center text-center">
                    <div class="flex-shrink-0 mb-3"><svg class="h-10 w-10 text-red-500" viewBox="0 0 20 20" fill="currentColor"><path fill-rule="evenodd" d="M10 18a8 8 0 100-16 8 8 0 000 16zM8.707 7.293a1 1 0 00-1.414 1.414L8.586 10l-1.293 1.293a1 1 0 101.414 1.414L10 11.414l1.293 1.293a1 1 0 001.414-1.414L11.414 10l1.293-1.293a1 1 0 00-1.414-1.414L10 8.586 8.707 7.293z" clip-rule="evenodd"/></svg></div>
                    <div>
                        <p class="text-base text-gray-800 font-semibold mb-2">PDF is currently unavailable.</p>
                        <a href="tel:7016036767" class="inline-block mt-2 bg-taara-yellow text-taara-black font-bold px-6 py-2 rounded-full shadow hover:bg-yellow-500 transition">Call 7016036767</a>
                    </div>
                </div>
            </div>

            <form id="leadForm" class="p-6 space-y-4" onsubmit="submitLeadForm(event)">
                <div><label class="block text-sm font-medium text-gray-700 mb-1">Full Name *</label><input type="text" required class="w-full border border-gray-300 rounded-md px-4 py-2 focus:ring-taara-yellow focus:border-taara-yellow"></div>
                <div><label class="block text-sm font-medium text-gray-700 mb-1">WhatsApp Number *</label><div class="flex"><span class="inline-flex items-center px-3 rounded-l-md border border-r-0 border-gray-300 bg-gray-50 text-gray-500 text-sm">+91</span><input type="tel" pattern="[0-9]{10}" required class="flex-1 min-w-0 block w-full px-4 py-2 border border-gray-300 rounded-none rounded-r-md focus:ring-taara-yellow focus:border-taara-yellow"></div></div>
                <div><label class="block text-sm font-medium text-gray-700 mb-1">Email Address</label><input type="email" class="w-full border border-gray-300 rounded-md px-4 py-2 focus:ring-taara-yellow focus:border-taara-yellow"></div>
                
                <button type="submit" class="w-full bg-taara-yellow hover:bg-yellow-500 text-taara-black font-bold py-3 rounded-md shadow transition mt-2 flex justify-center items-center gap-2">
                    <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 16v1a3 3 0 003 3h10a3 3 0 003-3v-1m-4-4l-4 4m0 0l-4-4m4 4V4"></path></svg>
                    Get PDF Now
                </button>
            </form>

            <div id="toastMsg" class="hidden absolute bottom-4 left-1/2 transform -translate-x-1/2 bg-gray-900 text-white px-4 py-2 rounded-full text-sm shadow-lg w-max">Checking...</div>
        </div>
    </div>

    <!-- MAIN JAVASCRIPT: THE MASTER ENGINE -->
    <script>
        const scriptURL = 'https://script.google.com/macros/s/AKfycbzaztsEw9GQJ1EmMWBmsFXAGZqvLjYUOI7hy9DfuEkylOF5c-5aM7wyX9jMxfb_gz42gw/exec'; 

        let currentPackageTitle = "";

        const urlParams = new URLSearchParams(window.location.search);
        const packageId = urlParams.get('id');

        if(packageId) {
            fetch(scriptURL)
                .then(res => res.json())
                .then(data => {
                    const pkg = data.find(p => p['Package ID'] === packageId);
                    if(pkg) {
                        currentPackageTitle = pkg['Title'];
                        document.getElementById('pkg-title').innerText = currentPackageTitle;
                        
                        const priceFmt = '₹' + Number(pkg['Price']).toLocaleString('en-IN');
                        document.getElementById('pkg-price-desktop').innerText = priceFmt;
                        document.getElementById('pkg-price-mobile').innerText = priceFmt;
                        document.getElementById('pkg-price-sticky').innerText = priceFmt;
                        
                        document.getElementById('pkg-location').innerText = pkg['Location'];
                        document.getElementById('pkg-duration').innerText = pkg['Duration'];
                        document.getElementById('pkg-image').src = pkg['Image URL'];
                        
                        const waMsg = `Hi, I am interested in the ${currentPackageTitle} package.`;
                        document.getElementById('pkg-whatsapp').href = `https://wa.me/917016036767?text=${encodeURIComponent(waMsg)}`;

                        document.getElementById('loader').style.display = 'none';
                        document.getElementById('content').style.display = 'block';
                    } else {
                        document.getElementById('loader').innerHTML = "<p class='text-red-500 font-bold'>Package Not Found!</p>";
                    }
                })
                .catch(err => {
                    document.getElementById('loader').innerHTML = "<p class='text-red-500 font-bold'>Error loading details. Please refresh.</p>";
                });
        } else {
            document.getElementById('loader').innerHTML = "<p class='text-red-500 font-bold'>No Package Selected.</p>";
        }

        const modal = document.getElementById('pdfModal');
        const toast = document.getElementById('toastMsg');
        const errorBox = document.getElementById('pdfErrorMsg');
        const leadForm = document.getElementById('leadForm');
        
        function openPdfModal() {
            modal.classList.remove('hidden');
            modal.classList.add('flex');
            errorBox.classList.add('hidden'); 
            leadForm.classList.remove('hidden'); 
        }

        function closePdfModal() {
            modal.classList.add('hidden');
            modal.classList.remove('flex');
        }

        function showPremiumError() {
            toast.classList.add('hidden');
            leadForm.classList.add('hidden');
            errorBox.classList.remove('hidden');
        }

        function submitLeadForm(e) {
            e.preventDefault();
            
            const submitBtn = e.target.querySelector('button[type="submit"]');
            submitBtn.innerHTML = 'Wait...';
            toast.classList.remove('hidden');
            toast.innerHTML = 'Checking details...';

            fetch(scriptURL, {
                method: 'POST',
                body: JSON.stringify({ 
                    name: e.target[0].value, 
                    phone: e.target[1].value, 
                    email: e.target[2].value, 
                    packageReq: currentPackageTitle 
                }),
                headers: { 'Content-Type': 'text/plain;charset=utf-8' }
            })
            .then(res => res.json())
            .then(data => {
                submitBtn.innerHTML = 'Get PDF Now';
                if(data.result === 'success') {
                    if(data.pdfUrl && data.pdfUrl.trim() !== "") {
                        toast.innerHTML = 'Downloading PDF...';
                        setTimeout(() => {
                            toast.classList.add('hidden');
                            closePdfModal();
                            window.open(data.pdfUrl, '_blank');
                            e.target.reset();
                        }, 800);
                    } else {
                        showPremiumError();
                        e.target.reset();
                    }
                } else {
                    showPremiumError();
                }
            })
            .catch(error => {
                submitBtn.innerHTML = 'Get PDF Now';
                showPremiumError();
            });
        }
    </script>
</body>
</html>
